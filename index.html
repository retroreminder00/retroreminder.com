<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retro Reminder | Classic Video Games</title>

<style>

body {
    margin: 0;
    background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55)),
        #4a2b18;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;


header {
    padding: 30px 20px;
}

.logo {
    max-width: 300px;
    width: 80%;
}

h1 {
    font-size: 42px;
    color: #8b5cf6;
    margin-bottom: 10px;
}

.tagline {
    font-size: 22px;
    color: #00d9ff;
}

.crt {
    margin: 40px auto;
    width: 90%;
    max-width: 650px;
    box-sizing: border-box;
    padding: 30px;
    position: relative;
    background: linear-gradient(
        90deg,
        #6b3f1f,
        #9b6335,
        #5a3218
    );
    border: 12px solid #2b1609;
    border-radius: 15px;
    box-shadow:
        0 25px 50px rgba(0,0,0,.8);
}

.crt h2 {
    color: #00d9ff;
}
.tv-screen {
    background: #050505;
    border-radius: 12px;
    padding: 45px 20px;
    width: 75%;
    border: 8px solid #111;
    box-shadow:
        inset 0 0 50px black;
}

.tv-screen h2 {
    color:#00d9ff;
    letter-spacing:5px;
}

.tv-controls {
    position: absolute;
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
    color:#d6b27c;
    font-size:18px;
    line-height:30px;
    .boot-text {
    margin-top:25px;
    color:#8b5cf6;
    font-size:18px;
    letter-spacing:3px;
}

.blink {
    margin-top:30px;
    color:#00d9ff;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% {
        opacity:0;
    }

.tv-screen {
    margin-right:70px;
}

.buttons a {
    display: inline-block;
    margin: 10px;
    padding: 15px 25px;
    background: #8b5cf6;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.buttons a:hover {
    background: #00d9ff;
    color: black;
}

footer {
    margin-top: 60px;
    color: #777;
}

@media (max-width:600px) {

h1 {
    font-size: 32px;
}

.tagline {
    font-size:18px;
}

.crt {
    width:85%;
}

}

</style>

</head>

<body>

<header>

<img class="logo" src="BF14DC22-B067-4DFE-AC93-59B43FFCD891.PNG" alt="Retro Reminder Logo">

<h1>RETRO REMINDER</h1>

<div class="tagline">
Classic Games. Memories. Collecting.
</div>

</header>


<div class="crt">

<div class="tv-screen">

<h2>PRESS START</h2>

<div class="boot-text">
RETRO REMINDER<br>
CLASSIC GAME COLLECTION
</div>

<p class="blink">
▶ INSERT CARTRIDGE
</p>

</div>

<div class="tv-controls">
<div>●</div>
<div>◉</div>
<div>◉</div>
</div>

</div>


<div class="buttons">

<a href="#">eBay Store</a>

<a href="#">YouTube</a>

<a href="#">TikTok</a>

<a href="#">Instagram</a>

</div>


<footer>

© Retro Reminder

</footer>


</body>
</html>
