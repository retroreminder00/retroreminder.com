```html
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retro Reminder | Classic Video Games</title>

<style>

body {
    margin:0;

    background:
        radial-gradient(
            circle at center,
            #252b30 0%,
            #15191d 55%,
            #090b0d 100%
        );

    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    min-height:100vh;
}

header {
    padding:25px 20px 10px;
}

.logo {
    display:none;
}

h1 {
    display:none;
}

.tagline {
    font-size:22px;
    color:#00d9ff;
    letter-spacing:1px;
}


/* TV CABINET */

.crt {
    margin:40px auto;
    width:90%;
    max-width:650px;
    box-sizing:border-box;
    padding:30px;
    position:relative;

    background:linear-gradient(
        90deg,
        #5a5a58,
        #858581,
        #4a4a48
    );

    border:12px solid #222;

    border-radius:15px;

    box-shadow:
        0 25px 50px rgba(0,0,0,.8),
        inset 0 0 20px rgba(255,255,255,.08);
}


/* CURVED CRT GLASS */

.tv-screen {

    position:relative;

    background:
        radial-gradient(
            ellipse at center,
            #777 0%,
            #555 45%,
            #333 78%,
            #1b1b1b 100%
        );

    border-radius:28px;

    width:75%;

    height:260px;

    box-sizing:border-box;

    padding:30px 15px;

    border:8px solid #181818;

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.9),
        inset 0 0 8px rgba(255,255,255,.15),
        0 0 8px rgba(0,0,0,.8);

    margin-right:70px;

    overflow:hidden;

    transition:.3s;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}


/* CRT GLASS REFLECTION */

.tv-screen::before {

    content:"";

    position:absolute;

    top:8px;
    left:12px;
    right:12px;

    height:35%;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,0) 55%
        );

    pointer-events:none;

    z-index:5;
}


/* SCREEN EDGE */

.tv-screen::after {

    content:"";

    position:absolute;

    inset:0;

    border-radius:28px;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.8);

    pointer-events:none;

    z-index:6;
}


.tv-screen h2 {
    color:#00d9ff;
    letter-spacing:5px;
    margin:5px 0;
}


.boot-text {

    margin-top:15px;

    color:#fff4d6;

    font-size:16px;

    font-weight:bold;

    letter-spacing:3px;

    text-shadow:
        -1px -1px 0 #111,
         1px -1px 0 #111,
        -1px  1px 0 #111,
         1px  1px 0 #111,
         0 0 6px rgba(0,0,0,.9);
}


.blink {

    margin-top:20px;

    color:#00d9ff;

    text-shadow:
        0 0 5px #00d9ff;

    animation:blink 1.2s infinite;
}


@keyframes blink {

    0%,49% {
        opacity:1;
    }

    50%,100% {
        opacity:0;
    }

}


/* CONTROLS */

.tv-controls {

    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    z-index:10;
}


.control-button {

    background:
        radial-gradient(
            circle at 35% 30%,
            #777,
            #333 45%,
            #111 100%
        );

    color:#d6b27c;

    border:2px solid #d6b27c;

    border-radius:50%;

    width:38px;

    height:38px;

    cursor:pointer;

    display:block;

    margin:auto;

    box-shadow:
        0 2px 4px rgba(0,0,0,.8),
        inset 1px 1px 2px rgba(255,255,255,.25);
}


.control-button:active {
    transform:scale(.94);
}


.control-label {

    font-size:9px;

    color:#d6b27c;

    margin-bottom:12px;
}


/* SPEAKER GRILLE */

.speaker-grille {

    position:absolute;

    right:80px;

    bottom:92px;

    width:48px;

    height:153px;

    border-radius:6px;

    background:
        repeating-linear-gradient(
            90deg,
            #111 0px,
            #111 3px,
            #444 3px,
            #444 5px,
            #171717 5px,
            #171717 8px
        );

    border:2px solid #292929;

    box-shadow:
        inset 2px 2px 6px rgba(0,0,0,.9),
        inset -1px -1px 2px rgba(255,255,255,.08),
        0 2px 4px rgba(0,0,0,.7);

    z-index:2;
}


/* RETRO REMINDER METALLIC LOGO */

.tv-logo-badge {

    position:absolute;

    right:80px;

    bottom:22px;

    width:65px;

    height:auto;

    display:block;

    filter:
        drop-shadow(1px 2px 2px rgba(0,0,0,.75));

    pointer-events:none;

    z-index:3;
}


/* POWER OFF */

.tv-screen.off {

    background:
        radial-gradient(
            ellipse at center,
            #191919 0%,
            #101010 60%,
            #080808 100%
        );

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.95),
        0 0 3px rgba(0,0,0,.8);

    cursor:default;
}


.tv-screen.off * {
    opacity:0;
}


/* 90s VISITOR COUNTER */

.visitor-counter {

    width:85%;

    max-width:650px;

    margin:40px auto;

    padding:20px;

    box-sizing:border-box;

    background:
        linear-gradient(
            180deg,
            #242424 0%,
            #111 100%
        );

    border:4px ridge #777;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.9),
        0 4px 10px rgba(0,0,0,.6);

    font-family:"Courier New", monospace;

    color:#39ff14;
}


.visitor-title {

    font-size:14px;

    letter-spacing:4px;

    color:#d6b27c;

    margin-bottom:10px;

    text-shadow:
        0 0 5px rgba(214,178,124,.5);
}


.visitor-subtitle {

    font-size:11px;

    letter-spacing:3px;

    color:#777;

    margin-bottom:8px;
}


#visitor-count {

    display:inline-block;

    min-width:180px;

    padding:8px 14px;

    background:#050505;

    border:3px inset #555;

    color:#39ff14;

    font-size:28px;

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 5px #39ff14,
        0 0 12px rgba(57,255,20,.5);

}


.visitor-footer {

    margin-top:10px;

    font-size:9px;

    color:#555;

    letter-spacing:2px;
}


/* FOOTER */

footer {
    margin-top:40px;
    color:#777;
}


/* MOBILE */

@media(max-width:600px){

    .tagline {
        font-size:18px;
    }

    .crt {
        width:85%;
    }

    .tv-screen {

        width:65%;

        height:230px;

        padding:25px 10px;

        border-radius:24px;

    }

    .tv-screen h2 {
        font-size:20px;
        letter-spacing:2px;
    }

    .boot-text {
        font-size:12px;
        letter-spacing:2px;
    }

    .blink {
        font-size:16px;
    }


    /* MOBILE LOGO */

    .tv-logo-badge {

        width:48px;

        right:67px;

        bottom:14px;

    }


    /* MOBILE SPEAKER */

    .speaker-grille {

        width:38px;

        height:108px;

        right:67px;

        bottom:64px;

    }


    /* MOBILE COUNTER */

    .visitor-counter {

        width:85%;

        padding:16px;

    }

    .visitor-title {

        font-size:11px;

        letter-spacing:3px;

    }

    #visitor-count {

        font-size:22px;

        min-width:150px;

        letter-spacing:4px;

    }

}

</style>

</head>


<body>


<header>

<div class="tagline">
Classic Games. Memories. Collecting.
</div>

</header>



<div class="crt">


<div class="tv-screen off">

<h2>
RETRO REMINDER
</h2>

<div class="boot-text">
CLASSIC GAME COLLECTION
</div>

<p class="blink">
▶ PRESS POWER
</p>

</div>



<div class="tv-controls">


<button
    onclick="toggleTV()"
    class="control-button"
>
●
</button>

<div class="control-label">
POWER
</div>


<button
    onclick="changeChannel()"
    class="control-button"
>
◉
</button>

<div class="control-label">
CHANNEL
</div>


<button
    onclick="changeVolume()"
    class="control-button"
>
◉
</button>

<div class="control-label">
VOLUME
</div>


</div>


<div class="speaker-grille"></div>


<img
    class="tv-logo-badge"
    src="retroreminderlogotransparent.png"
    alt="Retro Reminder"
>


</div>



<!-- 90s VISITOR COUNTER -->

<div class="visitor-counter">

    <div class="visitor-title">
        RETRO REMINDER
    </div>

    <div class="visitor-subtitle">
        YOU ARE VISITOR NUMBER
    </div>

    <div id="visitor-count">
        000000
    </div>

    <div class="visitor-footer">
        THANKS FOR STOPPING BY
    </div>

</div>



<footer>

© Retro Reminder

</footer>



<script src="script.js"></script>


<!-- VISITOR COUNTER -->

<script>

function updateVisitorCount(response) {

    let count = response.value;

    let formattedCount = String(count).padStart(6, "0");

    document.getElementById("visitor-count").textContent =
        formattedCount;
}

</script>


<script
    async
    src="https://counterapi.com/api/retroreminder.com/view/homepage?callback=updateVisitorCount"
></script>


</body>
</html>
```
